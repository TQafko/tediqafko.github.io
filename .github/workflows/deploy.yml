name: Build and deploy

on:
  push:
    branches:
      - react-native-site
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Export static site
        run: npx expo export --platform web

      - name: Prepare GitHub Pages files
        run: |
          python3 << 'PY'
          from pathlib import Path

          dist = Path("dist")
          if not dist.is_dir():
              raise SystemExit("dist/ was not created by expo export")

          (dist / ".nojekyll").write_text("")
          (dist / "CNAME").write_text("tediqafko.com\n")

          not_found = dist / "+not-found.html"
          if not_found.exists():
              (dist / "404.html").write_bytes(not_found.read_bytes())

          # Turn about.html into about/index.html so /about works on GitHub Pages.
          for html in list(dist.rglob("*.html")):
              if html.name in {"index.html", "404.html"}:
                  continue
              if any(part.startswith("_") or part.startswith("+") for part in html.parts):
                  continue
              dest_dir = html.with_suffix("")
              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / "index.html"
              dest.write_bytes(html.read_bytes())
              html.unlink()
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
